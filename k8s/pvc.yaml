---
# PersistentVolume for beets database (local storage on k3s-main)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: beetbox-data-pv
  labels:
    app: beetbox
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: beetbox-local
  hostPath:
    path: /opt/beetbox/data
    type: DirectoryOrCreate
---
# PersistentVolumeClaim for beets database
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: beetbox-data
  namespace: beetbox
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: beetbox-local
  resources:
    requests:
      storage: 1Gi
---
# PersistentVolume for music (NFS from nas - reuse existing)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: beetbox-music-pv
  labels:
    app: beetbox
spec:
  capacity:
    storage: 600Gi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: beetbox-nfs-music
  nfs:
    server: nas
    path: /mnt/media/music
    readOnly: true
---
# PersistentVolumeClaim for music
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: beetbox-music
  namespace: beetbox
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: beetbox-nfs-music
  resources:
    requests:
      storage: 600Gi
