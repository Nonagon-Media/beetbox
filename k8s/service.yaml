apiVersion: v1
kind: Service
metadata:
  name: beetbox
  namespace: beetbox
  labels:
    app: beetbox
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
    - name: api
      port: 8337
      targetPort: 8337
      protocol: TCP
  selector:
    app: beetbox
---
# NodePort service for direct access (optional)
apiVersion: v1
kind: Service
metadata:
  name: beetbox-nodeport
  namespace: beetbox
  labels:
    app: beetbox
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
  selector:
    app: beetbox
